<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 应用图标：浅米色圆角底 + 橘猫（与桌宠 Cat.tsx 的待机形态一致） -->
  <rect width="1024" height="1024" rx="232" fill="#fcefe3" />
  <g transform="translate(128 128) scale(3.84)">
    <!-- 耳朵 -->
    <g stroke-linejoin="round" stroke-width="10">
      <path d="M44 84 L46 24 L100 62 Z" fill="#f5a54e" stroke="#d9782f" />
      <path d="M156 84 L154 24 L100 62 Z" fill="#f5a54e" stroke="#d9782f" />
    </g>
    <path d="M56 74 L58 40 L84 60 Z" fill="#f4a0b0" />
    <path d="M144 74 L142 40 L116 60 Z" fill="#f4a0b0" />
    <!-- 脸 -->
    <ellipse cx="100" cy="112" rx="72" ry="62" fill="#f5a54e" stroke="#d9782f" stroke-width="3" />
    <!-- 白色口鼻 -->
    <ellipse cx="100" cy="146" rx="46" ry="32" fill="#fff7ec" />
    <!-- 额头条纹 -->
    <g stroke="#d9782f" stroke-width="6" stroke-linecap="round">
      <path d="M100 58 L100 72" />
      <path d="M84 64 L88 76" />
      <path d="M116 64 L112 76" />
    </g>
    <!-- 腮红 -->
    <ellipse cx="54" cy="128" rx="10" ry="6" fill="#ff8a94" opacity="0.45" />
    <ellipse cx="146" cy="128" rx="10" ry="6" fill="#ff8a94" opacity="0.45" />
    <!-- 眼睛 -->
    <ellipse cx="72" cy="108" rx="11" ry="14" fill="#2b201c" />
    <ellipse cx="128" cy="108" rx="11" ry="14" fill="#2b201c" />
    <circle cx="76" cy="102" r="4" fill="#fff" />
    <circle cx="132" cy="102" r="4" fill="#fff" />
    <!-- 鼻子和嘴 -->
    <path d="M92 122 L108 122 L100 131 Z" fill="#f2788a" stroke="#f2788a" stroke-width="3" stroke-linejoin="round" />
    <path d="M100 131 Q95 141 88 136 M100 131 Q105 141 112 136" fill="none" stroke="#2b201c" stroke-width="3" stroke-linecap="round" />
    <!-- 胡须 -->
    <g stroke="#5a4038" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <path d="M58 132 L24 126" />
      <path d="M58 140 L26 144" />
      <path d="M142 132 L176 126" />
      <path d="M142 140 L174 144" />
    </g>
  </g>
</svg>
