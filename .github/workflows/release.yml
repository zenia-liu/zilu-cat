name: Release

# 推送版本标签（如 v0.1.0）时自动构建 macOS 和 Windows 安装包，
# 并生成一个草稿 Release。检查无误后，在 GitHub 上手动点击「Publish release」即可对外发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      # 目前不做代码签名，禁止 electron-builder 自动寻找证书
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and type check
        run: |
          npm test
          npm run typecheck

      - name: Package
        run: npm run dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    name: Create draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: 自律猫 ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release/*
